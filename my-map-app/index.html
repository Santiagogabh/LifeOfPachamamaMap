<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos – Life Of Pachamama</title>
    
    
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/vite.svg" alt="Life Of Pachamama">
            </div>
            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#programas">Programas</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <section class="hero-section">
            <h1>¿Tienes dudas sobre Life of Pachamama?</h1>
            <p>Escríbenos y te daremos respuesta lo más pronto posible</p>
        </section>

        <div class="contact-container">
            <div class="contact-form">
                <h2>Envíanos tu pregunta</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nombre *</label>
                        <input type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo *</label>
                        <input type="email" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Asunto *</label>
                        <input type="text" id="subject" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Mensaje *</label>
                        <textarea id="message" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-submit">Enviar</button>
                </form>
            </div>

            <div class="map-container">
                <h3>Nuestra ubicación</h3>
                <!-- React montará el mapa aquí -->
                <div id="map-root"></div>
            </div>
        </div>
    </div>

    <!-- Vite inyectará el módulo principal aquí -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
